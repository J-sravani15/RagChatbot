image: python:3.13-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/uv

default:
  retry:
    max: 2
    when:
      - always

.setup: &setup
  - pip install uv

.setup_full: &setup_full
  - pip install uv
  - uv sync --frozen

stages:
  - lint
  - format
  - type_check
  - security
  - test
  - coverage
  - audit
  - compliance

ruff:
  stage: lint
  before_script:
    - *setup
  script:
    - uvx ruff check .
  allow_failure: false

ruff-format:
  stage: format
  before_script:
    - *setup
  script:
    - uvx ruff format --check .
  allow_failure: false

pylint:
  stage: lint
  before_script:
    - *setup
  script:
    - uvx pylint app.py manual_*.py
  allow_failure: false

flake8:
  stage: lint
  before_script:
    - *setup
  script:
    - uvx flake8 app.py manual_*.py tests/
  allow_failure: false

mypy:
  stage: type_check
  before_script:
    - *setup_full
  script:
    - uv run mypy app.py tests/
  allow_failure: false

bandit:
  stage: security
  before_script:
    - *setup
  script:
    - uvx bandit -c pyproject.toml -r app.py manual_*.py
  allow_failure: false

semgrep:
  stage: security
  before_script:
    - *setup
  script:
    - uvx semgrep --config=auto --config=.semgrep.toml --error .
  allow_failure: true

gitleaks:
  stage: security
  before_script:
    - *setup
  script:
    - uvx gitleaks detect --source . --config .gitleaks.toml --verbose --no-git
  allow_failure: true

pytest:
  stage: test
  before_script:
    - *setup_full
  script:
    - uv run pytest

coverage:
  stage: coverage
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\.?\d*)%/'
  before_script:
    - *setup_full
  script:
    - uv run pytest --cov=manual_sections --cov-report=term --cov-report=xml --cov-fail-under=50
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

dependency-audit:
  stage: audit
  before_script:
    - *setup
  script:
    - uv audit
  allow_failure: true

changelog-check:
  stage: compliance
  before_script:
    - *setup_full
  script:
    - uv run git-cliff --unreleased --check
  allow_failure: false

spec-kit-check:
  stage: compliance
  before_script:
    - *setup
  script:
    - test -d specify && echo "specify/ exists"
    - test -f constitution.md && echo "constitution.md exists"
    - test -d Templates && echo "Templates/ exists"
    - test -d specs && echo "specs/ exists"
  allow_failure: false
