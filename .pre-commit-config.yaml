repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint app.py manual_extract.py manual_sections.py manual_retrieval.py manual_llama.py manual_qa.py --rcfile=pyproject.toml
        language: system
        pass_filenames: false

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: ["--py39-plus"]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy app.py tests
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false

      - id: radon
        name: radon (complexity)
        entry: uv run radon cc app.py -s
        language: system
        pass_filenames: false
